name: CI

# PR/branch gate. The JS gate (typecheck + eslint + vitest) runs once on Linux;
# the Rust gate (clippy + cargo test) runs on Linux, Windows AND macOS so the
# platform-specific trees — Windows autofill (UIA) + Hello, the macOS appex
# paths — are actually compiled on every PR, not first discovered at release.
# The full cross-platform bundle build still lives in release.yml (tags only).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the repo. (A job that needs more
# must request it explicitly.) Pinned action SHAs below close the other half of
# the supply-chain gap — a moved tag can't inject new action code.
permissions:
  contents: read

jobs:
  # JS gate — typecheck + eslint + vitest (incl. the i18n locale-parity test).
  # Linux-only: no Rust toolchain needed, so it is fast and independent.
  js:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: JS gate (typecheck + eslint + vitest)
        run: npm run check

      # Coverage thresholds (see vitest.config.ts) — fails on a real regression.
      - name: Coverage
        run: npm run test:coverage

  # Rust gate — clippy + cargo test on every target OS so a #[cfg(windows)] /
  # #[cfg(target_os = "macos")] break fails the PR, not the release.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Tauri 2 links webkit2gtk-4.1 on Linux — required even to compile/clippy.
      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      # Caches ~/.cargo (incl. the large Bitwarden sdk-internal git checkout) and
      # src-tauri/target so the long first SDK compile is reused on warm runs.
      # Keyed per-OS by the action so the three matrix legs never collide.
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Rust lint (clippy, warnings = errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Includes export_ts_types, which regenerates src/lib/generated/dto.ts and
      # FAILS when the committed file is stale — the typegen drift gate.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Supply-chain gate: RUSTSEC advisories, license policy, banned/duplicate
  # crates, and crate-source pinning (see src-tauri/deny.toml). Independent of
  # the build — its own fast job, no webkit/node toolchain needed.
  deny:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          manifest-path: ./src-tauri/Cargo.toml

  # Secret scanning — a password manager must never ship a committed signing key
  # or real credential. Scans the full git history on PRs (see .gitleaks.toml,
  # which allowlists build output, generated code, and example test vectors).
  secrets:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
