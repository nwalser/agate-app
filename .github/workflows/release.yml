name: Release

# Triggered by a version tag (agate-v*). Builds Linux + macOS (arm64 + x86_64) +
# Windows, signs the updater artifacts with the minisign key, and publishes a
# (draft) GitHub Release including the updater `latest.json`.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — contents of the minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password
# (Optional, for OS code signing — see docs/SIGNING.md:)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
# Tag a release with:  npm version patch && git push --follow-tags  (after
# aligning the tauri.conf.json version), or push a tag like `agate-v0.2.0`.

on:
  push:
    tags:
      - 'agate-v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (free minisign keypair). Without these the release
          # has no .sig files and the in-app updater will reject updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional macOS Developer ID signing + notarization (see docs/SIGNING.md).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: agate-v__VERSION__
          releaseName: 'Agate v__VERSION__'
          releaseBody: 'Unofficial Bitwarden desktop client. Download the installer for your platform below. See docs/SIGNING.md for the first-launch security prompts on unsigned builds.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
