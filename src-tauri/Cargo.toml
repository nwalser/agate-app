[package]
name = "agate"
version = "0.2.0"
description = "Agate — unofficial cross-platform Bitwarden desktop client"
authors = ["Nathaniel Walser"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.82"

[lib]
name = "agate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: do NOT add the "devtools" feature here — it would enable the web
# inspector in RELEASE builds (a debug surface exposing decrypted secrets in the
# DOM). Debug builds enable devtools automatically without the feature.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Launch-at-login. Driven from Rust commands (ManagerExt::autolaunch), so no JS
# package is needed.
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native open-file dialog for picking a .kdbx database (called from Rust; no JS
# capability needed).
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Host OS UI locale for first-run language detection (get_system_locale).
sys-locale = "0.3"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Local-password unlock — crypto we own (wraps the SDK session key under a
# local-password-derived key, stored in the OS keychain). See unlock.rs.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# Bitwarden official SDK (sdk-internal). GPLv3. Pinned by rev because the
# password-manager SDK is explicitly unstable ("changes without warning").
# Bumping the rev is a deliberate, reviewed action — never float `main`.
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-pm = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-sync = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-generators = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-collections = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
bitwarden-state = { git = "https://github.com/bitwarden/sdk-internal", rev = "ef81e7ae1fa63616d84a8275511f4db98c09a64e" }
# zxcvbn: the add/edit-form's live password strength meter (src/strength.rs).
zxcvbn = "3.1"
# KeePass KDBX4 read/write (providers/keepass.rs). Write support is behind
# `save_kdbx4` and still labeled experimental upstream — every save goes
# through Agate's own atomic temp-write → reopen-verify → rename flow, with a
# .bak of the previous file, so a bad write can never destroy the database.
keepass = { version = "0.13", features = ["save_kdbx4"] }
# Atomic save scratch files for the KeePass provider (same-dir temp + persist).
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# Tiny loopback HTTP proxy used to fix self-hosted (Vaultwarden) prelogin: the
# SDK's identity client has no middleware hook, so we rewrite the one prelogin
# path at the network edge. See proxy.rs.
tiny_http = "0.12"

# Cross-platform biometric consent (Touch ID on macOS, polkit on Linux) for the
# non-Windows unlock path. ⚠️ The macOS/Linux arm (src/hello_unix.rs) is written
# on a Windows host and is NOT compiled or run here — it must be built + verified
# on that hardware before being relied upon.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
robius-authentication = "0.1"

[target.'cfg(windows)'.dependencies]
# Windows Hello (UserConsentVerifier) for passwordless unlock, and
# SetWindowDisplayAffinity for screen-capture protection. Windows-only so other
# platforms never resolve it. The UI Automation + input-synthesis + focus-hook
# features back the autofill watcher (src/autofill/{uia,inject,watcher}.rs).
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
